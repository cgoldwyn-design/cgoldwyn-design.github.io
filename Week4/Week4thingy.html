<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Kirby
    </title>
    <style>
        .cards {

            display: grid;
            grid-template-columns: 50% 50%;
            grid-template-rows: 200px 200px 200px;
            width: 75vw;
            background-color: rgb(110, 110, 110);
            justify-content: space-evenly;
          

            margin-bottom: 36px;

        }

        .cards>div {
            background-color: rgb(0, 0, 0);
            color: white;
            border: 5px solid rgb(255, 16, 16);
            box-sizing: border-box;
        }

        .cards2 {
            
            display: flex;
            flex-direction: row;
            width: 100vw;
            background-color: rgb(110, 110, 110);
            justify-content: flex-start;
          
        }

        .cards2>div {
            color: rgb(0, 0, 0);
            border: 5px solid rgb(255, 0, 0);
            box-sizing: border-box;
        }

      

        #one {
            background-color: rgb(30, 231, 249);
            
            flex-grow: 1;
            flex-shrink: 0;  
            flex-basis: 50%; 
         
        }

        #two {
            background-color: rgb(255, 235, 16);
            flex-grow: 5; 
            flex-shrink: 1; 
            

        }

        #three {
            background-color: rgb(255, 124, 53);
            flex-grow: 10; 
            flex-shrink: 5;
        }

       
        .sampleNav {
            background-color: rgb(0, 0, 0);
            color: white; 
            font-size: 24px; 
            font-family: monospace;
            width: 100vw; 
            padding: 10px; 
            display: flex; 
            justify-content: space-around;
            box-sizing: border-box;
        }

        .sampleNav > ul > img {
            width: 100px; 
        }

        .sampleNav ul  {
            display: flex;
            list-style: none;
            align-items: center;
            justify-content: center;

        }

        li { 
            flex-shrink: 10; 
            margin-right: 12px;
        }
    </style>
</head>

<body>



    <h1> </h1>
    <div class="cards">
        <div>
            <h3></h3>
            <p>

            </p>
        </div>

        <div>
            <h3> </h3>
            <p>

            </p>
        </div>

        <div>
            <h3></h3>
            <p>

             </p>
        </div>


    </div>
    </div>

    <h1></h1>
    
    <div class="cards2">
        <div id="one">
            <h3></h3>
            <p>

            </p>
        </div>

        <div id="two">
            <h3></h3>
            <p>

            </p>
        </div>

        <div id="three">
            <h3>
    
            </h3>
            <p>
                 </p>
        </div>


    </div>
    </div>

    <h1></h1>
   
    <nav class="sampleNav">
       
        <ul>
           
           
        </ul>
    </nav>
</body>

</html>
